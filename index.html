---
layout: default
---
<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <span class="date">{{ post.date | date: "%B %-d, %Y" }}</span>
    <br>
    <a href="{{ post.url }}">{{ post.title }}</a>
    {% if post.description %}<p class="description">{{ post.description }}</p>{% endif %}
  </li>
  {% endfor %}
</ul>
