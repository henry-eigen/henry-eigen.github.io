---
layout: default
---
<article>
  <a href="/" style="font-size: 0.9rem;">&larr; Back</a>
  <div class="post-header">
    <h1 style="margin-top: 1rem;">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
    <div class="post-meta">{{ page.date | date: "%B %-d, %Y" }} · Author: Henry Eigen</div>
  </div>
  {{ content }}
</article>
