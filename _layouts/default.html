<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #222;
      --muted: #666;
      --border: #e0e0e0;
      --link: #0056b3;
      --max-w: 780px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --fg: #e0e0e0;
        --muted: #999;
        --border: #333;
        --link: #6db3f2;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      background: var(--bg);
      line-height: 1.7;
      padding: 2rem 1.5rem;
      max-width: var(--max-w);
      margin: 0 auto;
    }
    header.site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      margin: -2rem -1.5rem 2.5rem;
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    header .site-title { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
    header .site-title a { color: var(--fg); text-decoration: none; }
    header .site-title a:hover { text-decoration: none; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; line-height: 1.3; }
    h2 { font-size: 1.3rem; margin-top: 2.5rem; margin-bottom: 0.75rem; }
    h3 { font-size: 1.1rem; margin-top: 2rem; margin-bottom: 0.5rem; }
    p { margin-bottom: 1rem; }
    img { max-width: 100%; height: auto; margin: 1.5rem 0; border-radius: 4px; }
    ul, ol { margin-bottom: 1rem; padding-left: 1.5rem; }
    li { margin-bottom: 0.3rem; }
    blockquote { border-left: 3px solid var(--border); padding-left: 1rem; margin: 1.5rem 0; color: var(--muted); font-size: 0.9rem; }
    code {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.9em;
      background: color-mix(in srgb, var(--fg) 8%, var(--bg));
      padding: 0.15em 0.35em;
      border-radius: 3px;
    }
    pre {
      background: color-mix(in srgb, var(--fg) 8%, var(--bg));
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 1rem;
    }
    pre code { background: none; padding: 0; }
    .post-meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
    .post-subtitle { font-size: 1.2rem; font-weight: 400; color: var(--muted); line-height: 1.35; margin-bottom: 0.5rem; }
    .post-header { text-align: center; }
    .blog-figure-row { display: flex; gap: 1rem; align-items: flex-start; margin: 1.5rem 0; }
    .blog-figure-row img { flex: 1; min-width: 0; margin: 0; }
    @media (max-width: 600px) { .blog-figure-row { flex-direction: column; } }
    .blog-figure { margin: 1.5rem 0; }
    .blog-figure figcaption { color: var(--muted); font-size: 0.85rem; line-height: 1.5; margin-top: 0.5rem; }
    .home-intro { margin-bottom: 2.5rem; }
    .home-intro .twitter-link { color: var(--fg); }
    .home-intro .twitter-link:hover { color: var(--link); }
    .post-card {
      display: block;
      background: color-mix(in srgb, var(--fg) 5%, var(--bg));
      border-radius: 10px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.5rem;
      color: var(--fg);
      text-decoration: none;
    }
    .post-card:hover { background: color-mix(in srgb, var(--fg) 9%, var(--bg)); text-decoration: none; }
    .post-card h2 { margin-top: 0; margin-bottom: 0.6rem; }
    .post-card .description { color: var(--muted); font-size: 0.92rem; line-height: 1.55; margin-bottom: 0.9rem; }
    .post-card .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 0; }
    hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    table { border-collapse: collapse; margin: 1.5rem auto; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
    th { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: left; padding: 0.4rem 0.9rem; border-bottom: 2px solid var(--fg); }
    td { padding: 0.4rem 0.9rem; border-bottom: 1px solid var(--border); }
    caption { caption-side: top; font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); text-align: left; padding-bottom: 0.3rem; }
    .table-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 0 1.5rem; align-items: start; }
    .table-note { color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
  </style>
  {% if page.mathjax %}
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
  {% endif %}
</head>
<body>
  <header class="site-header">
    <div class="site-title"><a href="/">{{ site.title }}</a></div>
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
